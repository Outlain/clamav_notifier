name: Validate and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python3 -m py_compile notifier.py

      - name: Validate Compose example
        env:
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_CHAT_ID: test-chat
        run: docker compose -f docker-compose.example.yml config --quiet

      - name: Build image
        run: docker build --tag "${{ github.event.repository.name }}:test" .

      - name: Run tests in the built image
        run: docker run --rm --env PYTHONPATH=/usr/local/bin --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python3 "${{ github.event.repository.name }}:test" -m unittest discover -s /workspace/tests -v

      - name: Verify non-root and read-only-root compatibility
        run: |
          docker run --rm --entrypoint id "${{ github.event.repository.name }}:test" -u | grep -qx 10001
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m --entrypoint python3 "${{ github.event.repository.name }}:test" -c 'import runpy; runpy.run_path("/usr/local/bin/notifier.py", run_name="not_main")'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate arm64 image build
        run: |
          docker buildx build --platform linux/arm64 --load --tag "${{ github.event.repository.name }}:test-arm64" .
          docker run --rm --env PYTHONPATH=/usr/local/bin --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python3 "${{ github.event.repository.name }}:test-arm64" -m unittest discover -s /workspace/tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
